<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ff">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24213a;
      background: #f5f3ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 16%, rgba(196, 181, 253, 0.35), transparent 34rem),
        radial-gradient(ellipse at 88% 82%, rgba(167, 243, 208, 0.28), transparent 30rem),
        #f8f7fc;
    }

    button {
      font: inherit;
    }

    .site-header {
      width: min(1120px, calc(100% - 40px));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: -0.03em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #6d5ce8;
      color: white;
      font-size: 1.2rem;
    }

    .header-note {
      color: #77748d;
      font-size: 0.88rem;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      min-height: calc(100vh - 136px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 390px);
      align-items: center;
      gap: clamp(40px, 8vw, 110px);
      padding: 48px 0 64px;
    }

    .intro {
      max-width: 510px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      color: #6253ce;
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 2px;
      background: currentColor;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 6vw, 4.7rem);
      font-weight: 760;
      letter-spacing: -0.075em;
      line-height: 1.02;
    }

    h1 span {
      color: #6d5ce8;
    }

    .intro-copy {
      max-width: 420px;
      margin: 22px 0 0;
      color: #77748d;
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .tip {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 32px;
      color: #77748d;
      font-size: 0.88rem;
    }

    .tip-key {
      display: inline-grid;
      min-width: 30px;
      height: 28px;
      padding: 0 7px;
      place-items: center;
      border: 1px solid #e7e4f1;
      border-radius: 7px;
      background: white;
      color: #4b4762;
      font-size: 0.8rem;
      box-shadow: 0 2px 3px rgba(48, 39, 91, 0.05);
    }

    .calculator {
      width: 100%;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(58, 48, 112, 0.12), 0 3px 12px rgba(58, 48, 112, 0.04);
      backdrop-filter: blur(12px);
    }

    .display {
      min-height: 126px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      padding: 16px 8px 22px;
      text-align: right;
    }

    .display-previous {
      min-height: 25px;
      max-width: 100%;
      overflow: hidden;
      color: #9995ad;
      font-size: 0.95rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display-current {
      width: 100%;
      overflow: hidden;
      color: #29263e;
      font-size: clamp(2.3rem, 8vw, 3.2rem);
      font-variant-numeric: tabular-nums;
      font-weight: 650;
      letter-spacing: -0.06em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .key {
      min-height: 58px;
      border: 0;
      border-radius: 15px;
      background: #f4f2fa;
      color: #3e3a55;
      cursor: pointer;
      font-size: 1.13rem;
      font-weight: 600;
      transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .key:hover {
      background: #ebe8f6;
    }

    .key:active {
      transform: scale(0.96);
    }

    .key:focus-visible {
      outline: 3px solid rgba(109, 92, 232, 0.4);
      outline-offset: 2px;
    }

    .key-function {
      background: #efedfa;
      color: #6253ce;
      font-size: 0.96rem;
    }

    .key-operator {
      background: #f0edff;
      color: #6253ce;
      font-size: 1.35rem;
    }

    .key-equals {
      grid-row: span 2;
      background: #6d5ce8;
      color: white;
      font-size: 1.4rem;
      box-shadow: 0 8px 16px rgba(109, 92, 232, 0.22);
    }

    .key-equals:hover {
      background: #5e4bd8;
    }

    .key-zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 24px;
    }

    footer {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      color: #89859d;
      font-size: 0.84rem;
      text-align: center;
    }

    footer strong {
      margin-left: 4px;
      color: #6253ce;
      font-weight: 650;
    }

    @media (max-width: 760px) {
      .site-header {
        min-height: 68px;
      }

      main {
        min-height: auto;
        grid-template-columns: 1fr;
        justify-items: center;
        gap: 34px;
        padding: 48px 0 54px;
      }

      .intro {
        max-width: 480px;
        text-align: center;
      }

      .eyebrow,
      .tip {
        justify-content: center;
      }

      .intro-copy {
        margin-right: auto;
        margin-left: auto;
      }

      .tip {
        margin-top: 22px;
      }

      .calculator {
        max-width: 390px;
      }
    }

    @media (max-width: 380px) {
      .site-header,
      main {
        width: min(100% - 28px, 1120px);
      }

      .calculator {
        padding: 16px;
        border-radius: 22px;
      }

      .keypad {
        gap: 8px;
      }

      .key {
        min-height: 54px;
        border-radius: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Simple Calculator home">
      <span class="brand-mark" aria-hidden="true">÷</span>
      <span>Simple Calculator</span>
    </a>
    <span class="header-note">A little math, made easy.</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Simple tools, clear thinking</p>
      <h1 id="page-title">Make every<br><span>number count.</span></h1>
      <p class="intro-copy">A clean, easy-to-use calculator for everyday sums. Tap a key or use your keyboard to get started.</p>
      <div class="tip" aria-label="Keyboard shortcuts">
        <span class="tip-key">0–9</span>
        <span class="tip-key">+</span>
        <span class="tip-key">−</span>
        <span class="tip-key">×</span>
        <span class="tip-key">÷</span>
        <span>Type to calculate</span>
      </div>
    </section>

    <section class="calculator" aria-label="Calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="display-previous" id="previous-operand"></div>
        <div class="display-current" id="current-operand">0</div>
      </div>
      <div class="keypad">
        <button class="key key-function" type="button" data-action="clear" aria-label="Clear all">AC</button>
        <button class="key key-function" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="key key-function" type="button" data-action="sign" aria-label="Change sign">+/−</button>
        <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button class="key" type="button" data-number="7">7</button>
        <button class="key" type="button" data-number="8">8</button>
        <button class="key" type="button" data-number="9">9</button>
        <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="key" type="button" data-number="4">4</button>
        <button class="key" type="button" data-number="5">5</button>
        <button class="key" type="button" data-number="6">6</button>
        <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button class="key" type="button" data-number="1">1</button>
        <button class="key" type="button" data-number="2">2</button>
        <button class="key" type="button" data-number="3">3</button>
        <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="key key-zero" type="button" data-number="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
  </main>

  <footer>Developed by <strong>Devansh Pundir</strong></footer>

  <script>
    (() => {
      const currentDisplay = document.getElementById("current-operand");
      const previousDisplay = document.getElementById("previous-operand");
      const keypad = document.querySelector(".keypad");

      let currentValue = "0";
      let previousValue = "";
      let operator = null;
      let shouldReplaceCurrent = false;

      const symbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

      function render() {
        currentDisplay.textContent = currentValue;
        previousDisplay.textContent = operator && previousValue
          ? `${previousValue} ${symbols[operator]}`
          : "";
      }

      function enterNumber(number) {
        if (currentValue === "Error" || shouldReplaceCurrent) {
          currentValue = number;
          shouldReplaceCurrent = false;
        } else if (currentValue === "0") {
          currentValue = number;
        } else if (currentValue.replace("-", "").length < 15) {
          currentValue += number;
        }
        render();
      }

      function chooseOperator(nextOperator) {
        if (currentValue === "Error") return;
        if (operator && !shouldReplaceCurrent) calculate();
        previousValue = currentValue;
        operator = nextOperator;
        shouldReplaceCurrent = true;
        render();
      }

      function calculate() {
        if (!operator || !previousValue || currentValue === "Error") return;

        const left = Number(previousValue);
        const right = Number(currentValue);
        let result;

        switch (operator) {
          case "+": result = left + right; break;
          case "-": result = left - right; break;
          case "*": result = left * right; break;
          case "/":
            if (right === 0) {
              currentValue = "Error";
              previousValue = "";
              operator = null;
              shouldReplaceCurrent = true;
              render();
              return;
            }
            result = left / right;
            break;
          default: return;
        }

        currentValue = String(Number(result.toPrecision(11)));
        previousValue = "";
        operator = null;
        shouldReplaceCurrent = true;
        render();
      }

      function clear() {
        currentValue = "0";
        previousValue = "";
        operator = null;
        shouldReplaceCurrent = false;
        render();
      }

      function deleteLast() {
        if (currentValue === "Error" || shouldReplaceCurrent) {
          currentValue = "0";
          shouldReplaceCurrent = false;
        } else {
          currentValue = currentValue.length > 1
            ? currentValue.slice(0, -1)
            : "0";
          if (currentValue === "-") currentValue = "0";
        }
        render();
      }

      function toggleSign() {
        if (currentValue === "Error") return;
        currentValue = currentValue.startsWith("-")
          ? currentValue.slice(1)
          : `-${currentValue}`;
        render();
      }

      function addDecimal() {
        if (currentValue === "Error" || shouldReplaceCurrent) {
          currentValue = "0.";
          shouldReplaceCurrent = false;
        } else if (!currentValue.includes(".")) {
          currentValue += ".";
        }
        render();
      }

      keypad.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;

        if (button.dataset.number !== undefined) enterNumber(button.dataset.number);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action === "equals") calculate();
        else if (button.dataset.action === "clear") clear();
        else if (button.dataset.action === "delete") deleteLast();
        else if (button.dataset.action === "sign") toggleSign();
        else if (button.dataset.action === "decimal") addDecimal();
      });

      document.addEventListener("keydown", (event) => {
        if (/^[0-9]$/.test(event.key)) enterNumber(event.key);
        else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
        else if (event.key === "." || event.key === ",") addDecimal();
        else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          calculate();
        } else if (event.key === "Backspace") deleteLast();
        else if (event.key === "Escape") clear();
      });

      render();
    })();
  </script>
</body>
</html>
